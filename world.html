<title>WorldHeart Style Walk</title>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Single-theme on purpose: this is a game viewport and the scene's own light is
   the only light. Every colour is painted explicitly. */
:root{
  --ink:#0e0c0b; --line:#2e2822; --fg:#efe9e0; --fg2:#a89e91; --fg3:#6f665c;
  --amber:#e0913a;
  --display:"Archivo",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font:14px/1.5 var(--display);
  overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{display:block}
#app{position:fixed;inset:0}

/* THE ONLY FULL-SCREEN GRADE LEFT IS FILM GRAIN, and only for the cel style,
   because grain genuinely IS a property of the film the image was shot on.
   The halftone screen that used to sit here for `inkline` has moved onto the
   surfaces themselves -- as a screen overlay it slid across the world as the
   camera turned, which reads as a filter laid over the render rather than ink
   printed on the thing you are looking at. */
#grade{position:fixed;inset:0;pointer-events:none;opacity:0}
#grade.on{opacity:1}
body[data-style="retroanime"] #grade{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='0.85'/></svg>");
  background-size:180px 180px;opacity:.30;mix-blend-mode:soft-light}
#vign{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.42) 100%)}

.hud{position:fixed;pointer-events:none;font-family:var(--mono);font-size:11.5px;
  color:var(--fg2);text-shadow:0 1px 3px rgba(0,0,0,.9)}
#topleft{top:14px;left:16px;pointer-events:auto}
#badge{display:inline-flex;align-items:center;gap:9px;background:rgba(14,12,11,.72);
  border:1px solid var(--line);padding:7px 12px;border-radius:2px;backdrop-filter:blur(6px)}
#badge b{font-family:var(--display);font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--fg);font-size:12px}
#badge i{width:9px;height:9px;border-radius:50%;display:block}
#switch{display:flex;gap:6px;margin-top:9px;pointer-events:auto}
#switch button{font:inherit;font-size:11.5px;font-family:var(--mono);cursor:pointer;
  background:rgba(14,12,11,.72);border:1px solid var(--line);color:var(--fg2);
  padding:5px 10px;border-radius:2px;backdrop-filter:blur(6px)}
#switch button:hover{color:var(--fg);border-color:#4a4036}
#switch button[aria-pressed=true]{border-color:var(--amber);color:var(--fg);background:#2a231b}
#keys{bottom:14px;left:16px}
#keys kbd{font-family:var(--mono);background:rgba(255,255,255,.08);
  border:1px solid var(--line);border-radius:2px;padding:1px 5px;margin:0 1px}
#cross{position:fixed;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
  border-radius:50%;background:rgba(255,255,255,.75);pointer-events:none;display:none}
body.playing #cross{display:block}
body.playing #keys{opacity:.45}

#gate{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,8,7,.88);
  backdrop-filter:blur(3px);cursor:pointer;z-index:5;text-align:center;padding:24px}
#gate.hide{display:none}
#gate h1{font-size:clamp(20px,4vw,34px);letter-spacing:.14em;text-transform:uppercase;
  margin:0 0 8px;font-weight:600}
#gate h1 span{color:var(--amber)}
#gate p{color:var(--fg2);margin:0 0 4px;max-width:50ch}
#gate .go{margin-top:20px;display:inline-block;border:1px solid var(--amber);color:var(--fg);
  padding:10px 22px;border-radius:2px;font-family:var(--mono);font-size:13px}
#bar{width:min(340px,70vw);height:2px;background:var(--line);margin:22px auto 0}
#bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .25s}
#err{color:#e07a6a;font-family:var(--mono);font-size:12px;margin-top:14px;max-width:60ch}
</style>

<div id="app"></div>
<div id="grade"></div>
<div id="vign"></div>
<div id="cross"></div>

<div class="hud" id="topleft">
  <div id="badge"><i></i><b>&mdash;</b></div>
  <div id="switch">
    <button data-s="retroanime">retroanime</button>
    <button data-s="inkcel">inkcel</button>
    <button data-s="inkline">inkline</button>
  </div>
</div>
<div class="hud" id="keys">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp; <kbd>shift</kbd> sprint &nbsp;
  <kbd>mouse</kbd> look &nbsp; <kbd>esc</kbd> release
</div>

<div id="gate">
  <div>
    <h1>WorldHeart <span>Style Walk</span></h1>
    <p id="gsub">Three art directions, one valley. Walk each and see how it feels.</p>
    <div id="bar"><i></i></div>
    <div class="go" id="golabel">loading&hellip;</div>
    <div id="err"></div>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {PointerLockControls} from 'three/addons/controls/PointerLockControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

// ONE VALLEY, THREE LOOKS. The terrain, the trees and the tower tableau are
// identical in all three styles; only the sky, the palette, the toon ramp and
// the ink change. That is the whole comparison -- if the ground moved too you
// could not tell a style apart from a location.
const STYLES = {
  retroanime:{
    hue:'#d98ba6', sky:'sky/retroanime.webp',
    fog:'#cfe0ea', fogNear:150, fogFar:520,
    grass:'#6f9e4e', grassHi:'#a8c46b', rock:'#8a8a72', trunk:'#6b4a33',
    sunDir:[-0.42,0.40,-1], sunCol:'#fff4dc', sunI:1.30,
    hemi:'#d8ecf7', hemiG:'#4e6b38', hemiI:1.20, amb:0.30,
    outline:0, hatch:0, hatchScale:0,
    toonSteps:4, ramp0:158, tint:'#ffffff', emissive:0.30, grain:true,
    note:'Hand-painted cel. Gouache sky, four-step ramp so the light reads as painted washes '
        +'rather than banding, and no contour anywhere — form is carried by colour alone.'},
  inkcel:{
    hue:'#f0e6d8', sky:'sky/inkcel.webp',
    fog:'#a9cbe0', fogNear:140, fogFar:480,
    grass:'#5d8a46', grassHi:'#8fb45c', rock:'#7a7360', trunk:'#543d2c',
    sunDir:[-0.50,0.44,-1], sunCol:'#fff6de', sunI:1.40,
    hemi:'#cfe4f4', hemiG:'#4a5a34', hemiI:1.05, amb:0.22,
    outline:0.035, hatch:0.42, hatchScale:11.0,
    toonSteps:3, ramp0:162, tint:'#ffffff', emissive:0.28, grain:false,
    note:'Cel fills under a thick black contour, with cross-hatch inked INTO the shadow '
        +'bands in the surface’s own space — it turns with the object, it does not slide.'},
  inkline:{
    hue:'#e05a3c', sky:'sky/inkline.webp',
    fog:'#e6dcc4', fogNear:130, fogFar:430,
    grass:'#8a9a57', grassHi:'#c2c07a', rock:'#a8886a', trunk:'#6e4b33',
    sunDir:[0.40,0.36,-1], sunCol:'#fff2d2', sunI:1.45,
    hemi:'#ffffff', hemiG:'#7d6a4a', hemiI:0.95, amb:0.26,
    outline:0.05, hatch:0.74, hatchScale:17.0,
    toonSteps:2, ramp0:176, tint:'#fff4e6', emissive:0.24, grain:false,
    note:'Printed comic. Two-step ramp and heavy benday hatching printed onto the surfaces '
        +'themselves, so the dots wrap the forms instead of lying flat across the screen.'}
};
const ASSETS = ['commander','enemy','tower'];

const app=document.getElementById('app'), gate=document.getElementById('gate');
const bar=document.querySelector('#bar i'), golabel=document.getElementById('golabel');
const errEl=document.getElementById('err');

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,900);
const controls=new PointerLockControls(camera,renderer.domElement);
let scene=null;

// ---------------------------------------------------------------- shading ---
const rampCache={};
function ramp(steps,floor){
  const k=steps+'|'+floor;
  if(rampCache[k])return rampCache[k];
  const d=new Uint8Array(steps);
  for(let i=0;i<steps;i++) d[i]=Math.round(floor+((255-floor)*i)/(steps-1));
  const t=new THREE.DataTexture(d,steps,1,THREE.RedFormat);
  t.needsUpdate=true; t.minFilter=t.magFilter=THREE.NearestFilter;
  rampCache[k]=t; return t;
}

// THE HATCHING FIX.
//
// This used to be a CSS dot screen over the whole viewport. It looked wrong for
// a reason worth naming: a screen-space pattern does not move with the world,
// so as you turned your head the dots stayed pinned to the glass and every
// object swam underneath them. It read as a filter on the lens, not as ink on
// the thing.
//
// Now the hatch is computed from the fragment's OBJECT-SPACE position and
// injected into the toon material's own fragment shader, after lighting. Two
// line sets at different angles, each gated on how dark the lit result already
// is: the first appears in mid shadow, the second crosses it in deep shadow.
// The lines belong to the surface, rotate with it, and follow its curvature —
// which is what hatching does on a drawing.
// `mul` scales the line FREQUENCY per object, and it is not optional. The hatch
// is computed in object space, so one global frequency gives a 2m character a
// readable five lines across the chest and the 760m terrain lines 0.4m apart --
// sub-pixel at any distance, which is why the ground first came back with no
// visible hatching at all. Big objects get a proportionally lower frequency so
// a hatch line is roughly the same physical thickness everywhere.
function hatchify(mat,S,mul){
  if(!S.hatch) return mat;
  const freq=S.hatchScale*(mul===undefined?1:mul);
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uHatch={value:S.hatch};
    sh.uniforms.uScale={value:freq};
    sh.uniforms.uFadeN={value:58.0};
    sh.uniforms.uFadeF={value:170.0};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vObjPos;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\n  vObjPos = position;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',
        '#include <common>\nvarying vec3 vObjPos;\nuniform float uHatch;\nuniform float uScale;'
        + '\nuniform float uFadeN;\nuniform float uFadeF;')
      .replace('#include <dithering_fragment>', `#include <dithering_fragment>
  {
    float lum = dot( gl_FragColor.rgb, vec3( 0.2126, 0.7152, 0.0722 ) );
    // Two line sets in the model's own space, so they turn with the mesh.
    float a = sin( ( vObjPos.x + vObjPos.y ) * uScale );
    float b = sin( ( vObjPos.x - vObjPos.z ) * uScale );
    float la = smoothstep( 0.0, 0.34, abs( a ) );
    float lb = smoothstep( 0.0, 0.34, abs( b ) );
    // darkness1 fades the first set in through mid shadow, darkness2 crosses
    // it only in the deepest shadow -- the standard build-up of a cross-hatch.
    // Open sunlit ground should carry NO ink. Hatching that starts at 0.74
    // striped a brightly lit field, which is not how anyone inks a drawing --
    // the hatch belongs in the shadow side of a form, not across the meadow.
    float d1 = smoothstep( 0.58, 0.30, lum );
    float d2 = smoothstep( 0.32, 0.10, lum );
    float ink = mix( 1.0, mix( 1.0, la, d1 ), 1.0 )
              * mix( 1.0, mix( 1.0, lb, d2 ), 1.0 );
    // Fade the hatch out with distance. A world-space line fine enough to read
    // as hatching at your feet turns into moire at fifty metres, so past uFadeN
    // the ink lifts and the far hills stay clean flat colour -- which is also
    // how a real inker treats depth.
    // 1/gl_FragCoord.w is the view distance, and unlike vViewPosition it is
    // guaranteed to exist in every material's fragment stage — relying on that
    // varying is what made the first version fail to compile and drop the whole
    // terrain out of the scene.
    float fade = 1.0 - smoothstep( uFadeN, uFadeF, 1.0 / gl_FragCoord.w );
    gl_FragColor.rgb *= mix( 1.0, ink, uHatch * fade );
  }`);
  };
  // Without a distinct cache key three.js reuses a previously compiled program
  // and the injection silently does nothing.
  mat.customProgramCacheKey=()=>'wh_hatch_'+S.hatch+'_'+freq;
  return mat;
}

function toonMat(S,opts,mul){
  return hatchify(new THREE.MeshToonMaterial(
    Object.assign({gradientMap:ramp(S.toonSteps,S.ramp0)},opts)),S,mul);
}

function outlineOf(geo,S,scale){
  return new THREE.Mesh(geo,new THREE.MeshBasicMaterial({
    color:0x0b0a09,side:THREE.BackSide,fog:false}));
}

function toonify(root,S){
  // Collect first, then mutate: adding the hull inside traverse() makes
  // traverse walk the hull it just made and give it a hull, forever.
  const meshes=[];
  root.traverse(o=>{ if(o.isMesh) meshes.push(o); });
  meshes.forEach(o=>{
    const src=o.material, tex=src&&src.map?src.map:null;
    if(tex) tex.colorSpace=THREE.SRGBColorSpace;
    o.material=toonMat(S,{
      map:tex,
      color:tex?new THREE.Color(S.tint):(src?src.color:0xcccccc),
      // The same texture as an emissive map keeps the SHADOWED side coloured;
      // a toon ramp alone throws hue away wherever the key light misses.
      emissiveMap:tex,
      emissive:new THREE.Color(S.emissive,S.emissive,S.emissive)});
    if(S.outline>0){
      const h=outlineOf(o.geometry,S);
      h.scale.multiplyScalar(1+S.outline);
      o.add(h);
    }
  });
}

// ------------------------------------------------------------------ world ---
let seed=20260915;
const rnd=()=>((seed=seed*1664525+1013904223>>>0)/4294967296);
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const h=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453; return n-Math.floor(n);};
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return (h(xi,yi)*(1-u)+h(xi+1,yi)*u)*(1-v)+(h(xi,yi+1)*(1-u)+h(xi+1,yi+1)*u)*v;
}
function heightAt(x,z){
  const d=Math.hypot(x,z);
  // The tableau stays level so the towers and the commander sit flat; the hills
  // only start once you are past them.
  const flat=Math.min(1,Math.max(0,(d-40)/45));
  return (vnoise(x*0.010,z*0.010)*13 + vnoise(x*0.035,z*0.035)*3.2 - 6)*flat;
}

function terrain(S){
  const g=new THREE.PlaneGeometry(760,760,150,150);
  g.rotateX(-Math.PI/2);
  const p=g.attributes.position;
  const col=[];
  const lo=new THREE.Color(S.grass), hi=new THREE.Color(S.grassHi);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), z=p.getZ(i), y=heightAt(x,z);
    p.setY(i,y);
    // Height-blended vertex colour: the crests catch the sun, the hollows stay
    // deep. Cheaper than a texture and it cannot tile-seam.
    col.push(...lo.clone().lerp(hi,Math.min(1,Math.max(0,(y+6)/16))).toArray());
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  const m=toonMat(S,{vertexColors:true,flatShading:true},0.17);
  return new THREE.Mesh(g,m);
}

function tree(S){
  const grp=new THREE.Group();
  const th=2.2+rnd()*2.4;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.34,th,5),
    toonMat(S,{color:new THREE.Color(S.trunk),flatShading:true},0.5));
  trunk.position.y=th/2; grp.add(trunk);
  const cr=1.7+rnd()*1.5;
  const canopy=new THREE.Mesh(new THREE.IcosahedronGeometry(cr,0),
    toonMat(S,{color:new THREE.Color(S.grassHi),flatShading:true},0.4));
  canopy.position.y=th+cr*0.55;
  canopy.scale.set(1,0.85+rnd()*0.35,1);
  grp.add(canopy);
  if(S.outline>0){
    [[trunk,trunk.geometry],[canopy,canopy.geometry]].forEach(([mesh,geo])=>{
      const h=outlineOf(geo,S); h.scale.multiplyScalar(1+S.outline*0.8); mesh.add(h);
    });
  }
  return grp;
}

function buildScene(S,skyTex){
  const s=new THREE.Scene();
  s.fog=new THREE.Fog(new THREE.Color(S.fog),S.fogNear,S.fogFar);

  // The sky is a painted panorama, not a gradient: the clouds ARE the style.
  const sky=new THREE.Mesh(new THREE.SphereGeometry(600,48,32),
    new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));
  s.add(sky);

  s.add(new THREE.HemisphereLight(new THREE.Color(S.hemi),new THREE.Color(S.hemiG),S.hemiI));
  const sd=new THREE.Vector3(...S.sunDir).normalize();
  const sun=new THREE.DirectionalLight(new THREE.Color(S.sunCol),S.sunI);
  sun.position.copy(sd.clone().multiplyScalar(160)); s.add(sun);
  const fill=new THREE.DirectionalLight(new THREE.Color(S.hemi),0.32);
  fill.position.copy(sd.clone().multiplyScalar(-110).setY(50)); s.add(fill);
  // A floor so no surface falls below the level where its paint stops reading.
  s.add(new THREE.AmbientLight(0xffffff,S.amb));

  s.add(terrain(S));

  seed=20260915;                      // same scatter in every style
  const rockMat=toonMat(S,{color:new THREE.Color(S.rock),flatShading:true},0.32);
  for(let i=0;i<70;i++){
    const r=46+rnd()*250, a=rnd()*Math.PI*2, sc=.8+rnd()*3.6;
    const rock=new THREE.Mesh(new THREE.IcosahedronGeometry(sc,0),rockMat);
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    rock.position.set(x,heightAt(x,z)+sc*.3,z);
    rock.rotation.set(rnd()*3,rnd()*3,rnd()*3);
    rock.scale.y=.55+rnd()*.7;
    if(S.outline>0){const h=outlineOf(rock.geometry,S);
      h.scale.multiplyScalar(1+S.outline*.7); rock.add(h);}
    s.add(rock);
  }
  for(let i=0;i<64;i++){
    const r=52+rnd()*260, a=rnd()*Math.PI*2;
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    const t=tree(S); t.position.set(x,heightAt(x,z),z);
    t.rotation.y=rnd()*6.28; s.add(t);
  }
  return s;
}

function fit(obj,targetHeight){
  const box=new THREE.Box3().setFromObject(obj);
  const size=new THREE.Vector3(); box.getSize(size);
  obj.scale.multiplyScalar(targetHeight/Math.max(size.y,1e-4));
  const b2=new THREE.Box3().setFromObject(obj);
  obj.position.y-=b2.min.y;
  return obj;
}

const loader=new GLTFLoader();
const texLoader=new THREE.TextureLoader();
// Plain glTF JSON with buffer and textures as data: URIs. NO BLOB ANYWHERE --
// given a .glb three.js builds a blob: URL per embedded texture, and where
// blob: is blocked the mesh parses but arrives completely unpainted.
function load(url){
  return new Promise((res,rej)=>loader.load(url,g=>res(g.scene),undefined,
    e=>rej(new Error((e&&e.message)||('failed to load '+url)))));
}
function loadTex(url){
  return new Promise((res,rej)=>texLoader.load(url,t=>{
    t.colorSpace=THREE.SRGBColorSpace; t.mapping=THREE.EquirectangularReflectionMapping;
    res(t);
  },undefined,()=>rej(new Error('failed to load '+url))));
}

async function enter(key){
  const S=STYLES[key];
  document.body.dataset.style=key;
  document.querySelector('#badge i').style.background=S.hue;
  document.querySelector('#badge b').textContent=key;
  document.querySelectorAll('#switch button').forEach(b=>
    b.setAttribute('aria-pressed',b.dataset.s===key));
  document.getElementById('gsub').textContent=S.note;
  errEl.textContent=''; bar.style.width='0%'; golabel.textContent='loading…';

  let done=0; const total=ASSETS.length+1;
  const step=()=>{bar.style.width=(++done/total*100)+'%';};

  let skyTex=null;
  try{ skyTex=await loadTex(S.sky); }
  catch(e){ errEl.textContent='Sky '+S.sky+' missing — '+e.message; }
  step();

  scene=buildScene(S,skyTex);
  scene.add(controls.getObject());
  const spawn=new THREE.Vector3(0,1.7,30);
  controls.getObject().position.copy(spawn);
  camera.rotation.set(0,0,0);

  const got={};
  for(const a of ASSETS){
    try{ got[a]=await load(`models3d_gltf/${key}_${a}.json`); }
    catch(e){ errEl.textContent='Could not load models3d_gltf/'+key+'_'+a+'.json — '+e.message; }
    step();
  }

  if(got.commander){
    const c=fit(got.commander.clone(true),1.9); toonify(c,S);
    c.position.set(0,c.position.y,19); c.rotation.y=Math.PI; scene.add(c);
  }
  if(got.tower){
    [[-12,3],[0,-5],[13,2]].forEach(([x,z],i)=>{
      const t=fit(got.tower.clone(true),i===1?4.8:3.9); toonify(t,S);
      t.position.set(x,t.position.y,z); t.rotation.y=(i-1)*0.5; scene.add(t);
    });
  }
  if(got.enemy){
    for(let i=0;i<10;i++){
      const e=fit(got.enemy.clone(true),1.15); toonify(e,S);
      const a=(i/10)*Math.PI-Math.PI/2;
      const x=Math.sin(a)*(10+(i%3)*4), z=-26-(i%4)*7;
      e.position.set(x,e.position.y+heightAt(x,z),z);
      e.rotation.y=Math.PI+a*.4; scene.add(e);
    }
  }
  golabel.textContent='click to walk';
  document.getElementById('grade').classList.toggle('on',!!S.grain);
}

const key={}, vel=new THREE.Vector3();
addEventListener('keydown',e=>{key[e.code]=true; if(e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>key[e.code]=false);
gate.addEventListener('click',()=>{ if(scene) controls.lock(); });
controls.addEventListener('lock',()=>{gate.classList.add('hide');document.body.classList.add('playing');});
controls.addEventListener('unlock',()=>{gate.classList.remove('hide');document.body.classList.remove('playing');});
document.querySelectorAll('#switch button').forEach(b=>b.addEventListener('click',ev=>{
  ev.stopPropagation(); controls.unlock(); gate.classList.remove('hide');
  const u=new URL(location); u.searchParams.set('style',b.dataset.s);
  history.replaceState({},'',u); enter(b.dataset.s);
}));

let last=performance.now();
renderer.setAnimationLoop(()=>{
  const now=performance.now(), dt=Math.min((now-last)/1000,.1); last=now;
  if(!scene) return;
  if(controls.isLocked){
    const sp=(key.ShiftLeft||key.ShiftRight?16:7)*dt;
    vel.set(0,0,0);
    if(key.KeyW||key.ArrowUp)vel.z+=1;
    if(key.KeyS||key.ArrowDown)vel.z-=1;
    if(key.KeyA||key.ArrowLeft)vel.x-=1;
    if(key.KeyD||key.ArrowRight)vel.x+=1;
    if(vel.lengthSq()>0){
      vel.normalize();
      controls.moveForward(vel.z*sp); controls.moveRight(vel.x*sp);
    }
    const p=controls.getObject().position;
    const d=Math.hypot(p.x,p.z);
    if(d>300){p.x*=300/d;p.z*=300/d;}
    p.y=heightAt(p.x,p.z)+1.7;         // walk the hills instead of floating
  }
  renderer.render(scene,camera);
});
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const want=new URL(location).searchParams.get('style');
enter(STYLES[want]?want:'retroanime');
</script>
